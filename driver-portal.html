<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Logistics | Driver Job Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="relative w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-xl flex items-center justify-center shadow-lg shadow-orange-600/30 text-white font-black tracking-tighter text-lg">
                    <span>KP</span>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-900 border-2 border-white rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-truck text-[6px] text-orange-400"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide leading-tight text-white">KP Logistics</h1>
                    <span class="text-[9px] text-orange-400 font-semibold uppercase tracking-widest block">Driver Portal</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="driver.html" class="text-slate-300 hover:text-orange-400 transition">Onboarding Registration</a>
                <a href="complete-profile.html" class="text-slate-300 hover:text-orange-400 transition">Complete Profile</a>
                <a href="driver-portal.html" class="text-orange-400 font-semibold transition">Available Jobs</a>
                <a href="admin.html" class="text-slate-300 hover:text-orange-400 transition">Admin Panel</a>
            </nav>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="max-w-5xl mx-auto my-10 px-6">
        
        <!-- Driver Authentication / Status Bar -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-orange-600">Active Fleet Portal</span>
                <h2 class="text-xl font-extrabold text-slate-900">Available Paid Trips</h2>
                <p class="text-xs text-slate-500 mt-0.5">Accept secured customer orders to dispatch your vehicle.</p>
            </div>
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <input type="tel" id="driverPhoneLogin" maxlength="10" placeholder="Enter 10-digit mobile" class="p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 w-full md:w-60">
                <button id="loadJobsBtn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition whitespace-nowrap shadow-md shadow-orange-600/20">
                    Refresh Jobs
                </button>
            </div>
        </div>

        <!-- Trips Feed Grid -->
        <div id="tripFeed" class="space-y-4">
            <!-- Dynamic trip cards load here -->
            <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
                <i class="fa-solid fa-truck-fast text-orange-500 text-2xl mb-2 block"></i>
                Enter your registered mobile number and click <b>Refresh Jobs</b> to scan for secure paid loads.
            </div>
        </div>

    </main>

    <!-- Firebase & Portal Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
            authDomain: "kp-logistics-1a015.firebaseapp.com",
            projectId: "kp-logistics-1a015",
            storageBucket: "kp-logistics-1a015.firebasestorage.app",
            messagingSenderId: "334125590321",
            appId: "1:334125590321:web:2adf74f76c7a68c6ddb210",
            measurementId: "G-DD5MCVTC81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loadJobsBtn = document.getElementById('loadJobsBtn');
        const tripFeed = document.getElementById('tripFeed');

        loadJobsBtn.addEventListener('click', async () => {
            const driverPhone = document.getElementById('driverPhoneLogin').value.trim();
            if (!driverPhone || driverPhone.length !== 10) {
                alert("Please enter a valid 10-digit registered mobile number to view matching jobs.");
                return;
            }

            tripFeed.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-orange-500 text-2xl mb-2 block"></i> Searching database for secured trips...</div>`;

            try {
                // Query bookings where status is Paid - Pending Driver Assignment
                const q = query(collection(db, "bookings"), where("status", "==", "Paid - Pending Driver Assignment"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    tripFeed.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-500 text-sm">No paid trips currently waiting in the pool. Check back soon!</div>`;
                    return;
                }

                tripFeed.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const trip = documentSnap.data();
                    const tripId = documentSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6 hover:shadow-md transition";
                    
                    card.innerHTML = `
                        <div class="space-y-2 flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                    <i class="fa-solid fa-shield-check"></i> Paid & Secured Escrow
                                </span>
                                <span class="bg-orange-100 text-orange-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                    ${trip.vehicleType.toUpperCase()}
                                </span>
                            </div>
                            <div class="text-xs space-y-1 text-slate-600">
                                <p><b><i class="fa-solid fa-location-dot text-orange-600 mr-1"></i> Pickup:</b> ${trip.pickup}</p>
                                <p><b><i class="fa-solid fa-flag-checkered text-slate-400 mr-1"></i> Dropoff:</b> ${trip.dropoff}</p>
                                <p><b><i class="fa-solid fa-users text-slate-400 mr-1"></i> Loaders:</b> ${trip.assistantsRequested || 0}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end space-y-3 w-full md:w-auto border-t md:border-t-0 pt-4 md:pt-0 border-slate-100">
                            <div class="text-right">
                                <p class="text-[10px] text-slate-400 uppercase font-semibold">Total Payout Fare</p>
                                <p class="text-2xl font-black text-orange-600">${trip.estimatedFare}</p>
                            </div>
                            <button data-id="${tripId}" class="accept-trip-btn w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center space-x-2">
                                <span>Accept & Claim Trip</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    `;
                    tripFeed.appendChild(card);
                });

                // Attach event listeners to all generated accept buttons
                document.querySelectorAll('.accept-trip-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const targetId = e.currentTarget.getAttribute('data-id');
                        if (confirm("Are you sure you want to claim and commit to this trip?")) {
                            try {
                                const tripRef = doc(db, "bookings", targetId);
                                await updateDoc(tripRef, {
                                    status: `Assigned (Driver: ${driverPhone})`,
                                    claimedAt: new Date()
                                });
                                alert("Trip successfully claimed! Contact customer and proceed to pickup.");
                                loadJobsBtn.click(); // Refresh list
                            } catch (err) {
                                console.error("Error claiming trip: ", err);
                                alert("Failed to claim trip. It may have already been taken.");
                            }
                        }
                    });
                });

            } catch (error) {
                console.error("Error loading trips feed: ", error);
                tripFeed.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-red-200 text-center text-red-600 text-sm">Error loading active trips feed. Please check console.</div>`;
            }
        });
    </script>
</body>
</html>
