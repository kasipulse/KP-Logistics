<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Logistics | Driver - Job Feed</title>
    
    <!-- Blue Driver App Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='42' fill='%23ffffff'>KP</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='42' fill='%23ffffff'>KP</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-600 selection:text-white">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black tracking-tighter text-base shadow-md shadow-blue-600/30">
                    KP
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wider uppercase leading-none text-white">KP Logistics</h1>
                    <span class="text-[9px] text-blue-400 font-semibold uppercase tracking-widest block mt-0.5">Driver Portal</span>
                </div>
            </div>
            
            <nav class="hidden md:flex space-x-6 text-xs font-semibold tracking-wide uppercase items-center">
                <a href="driver-portal.html" class="text-blue-400 transition">Available Jobs</a>
                <a href="complete-profile.html" class="text-slate-300 hover:text-blue-400 transition">Complete Profile</a>
                <a href="driver.html" class="text-slate-300 hover:text-blue-400 transition">Onboarding</a>
                <button id="logoutNavBtn" class="hidden bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded-lg transition border border-red-500/30">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <button id="installAppBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition shadow-md shadow-blue-600/20 uppercase tracking-wider items-center space-x-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span>Install App</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="max-w-5xl mx-auto my-10 px-6">
        
        <!-- Driver Authentication / Status Bar -->
        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 to-sky-400"></div>
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-blue-600">Secure Fleet Portal</span>
                <h2 id="portalTitle" class="text-xl font-black text-slate-900 tracking-tight mt-0.5">Local Paid Trips Feed</h2>
                <p id="portalSubtitle" class="text-xs text-slate-500 mt-1 leading-relaxed">Enter your mobile number and security PIN to access regional loads.</p>
            </div>
            <div id="loginControlGroup" class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-3 w-full md:w-auto">
                <input type="tel" id="driverPhoneLogin" maxlength="10" placeholder="Mobile (082...)" class="p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white w-full sm:w-44 transition text-slate-900">
                <input type="password" id="driverPinLogin" maxlength="6" placeholder="PIN" class="p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white w-full sm:w-28 transition text-slate-900">
                <button id="loadJobsBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-xl text-xs transition whitespace-nowrap shadow-lg shadow-blue-600/20 uppercase tracking-wider w-full sm:w-auto">
                    Secure Login
                </button>
            </div>
            <div id="logoutControlGroup" class="hidden flex items-center space-x-3">
                <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-4 py-3 rounded-xl text-xs transition border border-red-200 uppercase tracking-wider flex items-center space-x-2">
                    <i class="fa-solid fa-power-off"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </div>

        <!-- Trips Feed Grid -->
        <div id="tripFeed" class="space-y-4">
            <div class="bg-white p-8 rounded-3xl border border-slate-200 text-center text-slate-400 text-xs shadow-sm">
                <i class="fa-solid fa-lock text-blue-600 text-2xl mb-2 block"></i>
                Please enter your registered mobile number and PIN to unlock your secure job feed.
            </div>
        </div>

    </main>

    <!-- Firebase & Portal Logic Script with Session Persistence & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
                alert("📱 To install on your iPhone:\n\n1. Tap the 'Share' button ⎋ below.\n2. Select 'Add to Home Screen ➕'.");
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            } else {
                alert("To install this app, open your browser menu and select 'Install App' or 'Add to Home Screen'.");
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
            authDomain: "kp-logistics-1a015.firebaseapp.com",
            projectId: "kp-logistics-1a015",
            storageBucket: "kp-logistics-1a015.firebasestorage.app",
            messagingSenderId: "334125590321",
            appId: "1:334125590321:web:2adf74f76c7a68c6ddb210",
            measurementId: "G-DD5MCVTC81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loadJobsBtn = document.getElementById('loadJobsBtn');
        const tripFeed = document.getElementById('tripFeed');

        async function authenticateAndLoadJobs(phone, pin) {
            tripFeed.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-slate-200 text-center text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-blue-600 text-2xl mb-2 block"></i> Authenticating secure driver profile...</div>`;

            try {
                const driverQuery = query(collection(db, "drivers"), where("phone", "==", phone));
                const driverSnapshot = await getDocs(driverQuery);

                if (driverSnapshot.empty) {
                    tripFeed.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-red-200 text-center text-red-600 text-xs"><b>Phone number not registered.</b> Please complete your vehicle onboarding first.</div>`;
                    return;
                }

                let driverAuthenticated = false;
                let driverZone = "East Rand";
                let driverName = "Driver";

                driverSnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if ((data.pin && data.pin === pin) || !data.pin) {
                        driverAuthenticated = true;
                        if (data.zone) driverZone = data.zone;
                        if (data.name) driverName = data.name;
                    }
                });

                if (!driverAuthenticated) {
                    tripFeed.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-red-200 text-center text-red-600 text-xs"><b>Incorrect PIN.</b> Access denied.</div>`;
                    return;
                }

                // Save session so they stay logged in
                localStorage.setItem('kp_driver_phone', phone);
                localStorage.setItem('kp_driver_pin', pin);

                // Switch top UI to active session mode
                document.getElementById('loginControlGroup').classList.add('hidden');
                document.getElementById('logoutControlGroup').classList.remove('hidden');
                document.getElementById('logoutNavBtn').classList.remove('hidden');

                document.getElementById('portalTitle').innerText = `Welcome, ${driverName} (${driverZone})`;
                document.getElementById('portalSubtitle').innerText = `Securely showing paid escrow loads filtered for your zone.`;

                const q = query(
                    collection(db, "bookings"), 
                    where("status", "==", "Paid - Pending Driver Assignment"),
                    where("zone", "==", driverZone)
                );
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    tripFeed.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-slate-200 text-center text-slate-500 text-xs">No active paid trips currently available in <b>${driverZone}</b>. Check back soon!</div>`;
                    return;
                }

                tripFeed.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const trip = documentSnap.data();
                    const tripId = documentSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-3xl border border-slate-200 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 hover:shadow-2xl transition";
                    
                    card.innerHTML = `
                        <div class="space-y-3 flex-1">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    <i class="fa-solid fa-shield-check mr-1"></i> Paid Escrow
                                </span>
                                <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    ${trip.vehicleType.toUpperCase()}
                                </span>
                                <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    Zone: ${trip.zone || driverZone}
                                </span>
                            </div>
                            <div class="text-xs space-y-1.5 text-slate-600">
                                <p><b><i class="fa-solid fa-location-dot text-blue-600 mr-1.5"></i> Pickup:</b> ${trip.pickup}</p>
                                <p><b><i class="fa-solid fa-flag-checkered text-slate-400 mr-1.5"></i> Dropoff:</b> ${trip.dropoff}</p>
                                <p><b><i class="fa-solid fa-users text-slate-400 mr-1.5"></i> Loaders:</b> ${trip.assistantsRequested || 0}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end space-y-3 w-full md:w-auto border-t md:border-t-0 pt-4 md:pt-0 border-slate-100">
                            <div class="text-right">
                                <p class="text-[10px] text-slate-400 uppercase font-semibold">Total Payout Fare</p>
                                <p class="text-2xl font-black text-blue-600">${trip.estimatedFare}</p>
                            </div>
                            <button data-id="${tripId}" class="accept-trip-btn w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center space-x-2 uppercase tracking-wider">
                                <span>Accept & Claim Trip</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    `;
                    tripFeed.appendChild(card);
                });

                document.querySelectorAll('.accept-trip-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const targetId = e.currentTarget.getAttribute('data-id');
                        if (confirm("Are you sure you want to claim and commit to this local trip?")) {
                            try {
                                const tripRef = doc(db, "bookings", targetId);
                                await updateDoc(tripRef, {
                                    status: `Assigned (Driver: ${phone})`,
                                    claimedAt: new Date()
                                });
                                alert("Trip successfully claimed! Proceed to pickup.");
                                authenticateAndLoadJobs(phone, pin);
                            } catch (err) {
                                console.error("Error claiming trip: ", err);
                                alert("Failed to claim trip. It may have already been taken.");
                            }
                        }
                    });
                });

            } catch (error) {
                console.error("Error authenticating driver: ", error);
                tripFeed.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-red-200 text-center text-red-600 text-xs">Authentication error. Please check your connection.</div>`;
            }
        }

        loadJobsBtn.addEventListener('click', () => {
            const phone = document.getElementById('driverPhoneLogin').value.trim();
            const pin = document.getElementById('driverPinLogin').value.trim();

            if (!phone || phone.length !== 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }
            if (!pin) {
                alert("Please enter your security PIN.");
                return;
            }
            authenticateAndLoadJobs(phone, pin);
        });

        // Logout handler
        function handleLogout() {
            localStorage.removeItem('kp_driver_phone');
            localStorage.removeItem('kp_driver_pin');
            window.location.reload();
        }

        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('logoutNavBtn').addEventListener('click', handleLogout);

        // Auto-login on page load if session exists
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('kp_driver_phone');
            const savedPin = localStorage.getItem('kp_driver_pin');
            if (savedPhone && savedPin) {
                document.getElementById('driverPhoneLogin').value = savedPhone;
                document.getElementById('driverPinLogin').value = savedPin;
                authenticateAndLoadJobs(savedPhone, savedPin);
            }
        });
    </script>
</body>
</html>
