<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Portal | KP Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans antialiased min-h-screen">

  <header class="bg-slate-950 px-4 py-4 border-b border-slate-800 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center font-black text-xs">KP</div>
      <h1 class="text-sm font-extrabold uppercase tracking-wider">Driver Portal</h1>
    </div>
    <span id="connectionStatus" class="text-[10px] font-bold uppercase tracking-widest text-red-400">Offline</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Profile Section -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Your Profile</h2>
      <div class="space-y-3">
        <input type="text" id="regName" placeholder="Full Name" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        <input type="tel" id="regPhone" placeholder="Phone Number (e.g. 0821234567)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        <input type="text" id="regPlate" placeholder="Vehicle Plate (e.g. JHB 123 GP)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        <select id="regVehicle" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none text-white">
          <option value="bakkie">Light Bakkie (1-Ton)</option>
          <option value="closedbakkie">Canopy Bakkie</option>
          <option value="panelvan">Panel Van</option>
          <option value="medtruck">Medium Truck (4-Ton)</option>
          <option value="8ton">8-Ton Heavy Truck</option>
        </select>
        <select id="regZone" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none text-white">
          <option value="East Rand">East Rand</option>
          <option value="Johannesburg">Johannesburg</option>
          <option value="Pretoria">Pretoria</option>
          <option value="West Rand">West Rand</option>
          <option value="Vaal">Vaal</option>
        </select>
        <button id="saveProfileBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition">
          Save Profile
        </button>
      </div>
    </div>

    <!-- Online Toggle -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 text-center space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Availability</h2>
      <p class="text-xs text-slate-500">Go online to receive dispatch requests. Your location is only captured when you go online.</p>
      <button id="toggleOnlineBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-wider shadow-lg shadow-emerald-600/20 transition">
        Go Online
      </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-950 border border-slate-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xl z-50"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
      authDomain: "kp-logistics-1a015.firebaseapp.com",
      projectId: "kp-logistics-1a015",
      storageBucket: "kp-logistics-1a015.firebasestorage.app",
      messagingSenderId: "334125590321",
      appId: "1:334125590321:web:2adf74f76c7a68c6ddb210"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // For MVP, we use the driver's phone number as their unique ID
    // In a full app, this would come from Firebase Auth
    let driverId = localStorage.getItem('kp_driver_id'); 
    let isOnline = false;

    const toggleBtn = document.getElementById('toggleOnlineBtn');
    const statusText = document.getElementById('connectionStatus');

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xl z-50 border ${isError ? 'bg-red-600 border-red-500' : 'bg-emerald-600 border-emerald-500'}`;
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    // Load existing profile
    async function loadProfile() {
      if (!driverId) return;
      const snap = await getDoc(doc(db, 'drivers', driverId));
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById('regName').value = data.name || '';
        document.getElementById('regPhone').value = data.phone || '';
        document.getElementById('regPlate').value = data.plate || '';
        document.getElementById('regVehicle').value = data.vehicleType || 'bakkie';
        document.getElementById('regZone').value = data.zone || 'East Rand';
        
        isOnline = data.status === 'online';
        updateToggleUI();
      }
    }

    function updateToggleUI() {
      if (isOnline) {
        statusText.textContent = 'Online';
        statusText.className = 'text-[10px] font-bold uppercase tracking-widest text-emerald-400';
        toggleBtn.textContent = 'Go Offline';
        toggleBtn.className = 'w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-wider shadow-lg shadow-red-600/20 transition';
      } else {
        statusText.textContent = 'Offline';
        statusText.className = 'text-[10px] font-bold uppercase tracking-widest text-red-400';
        toggleBtn.textContent = 'Go Online';
        toggleBtn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-wider shadow-lg shadow-emerald-600/20 transition';
      }
    }

    // Save Profile
    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const plate = document.getElementById('regPlate').value.trim();
      const vehicleType = document.getElementById('regVehicle').value;
      const zone = document.getElementById('regZone').value;

      if (!name || !phone || !plate) {
        showToast('Please fill all fields', true);
        return;
      }

      // Normalize phone to be the ID
      let cleanPhone = phone.replace(/\s+/g, '').replace(/^0/, '27');
      driverId = cleanPhone;
      localStorage.setItem('kp_driver_id', driverId);

      try {
        await setDoc(doc(db, 'drivers', driverId), {
          name, phone, plate, vehicleType, zone,
          status: isOnline ? 'online' : 'offline',
          updatedAt: new Date()
        }, { merge: true });
        showToast('Profile saved!');
      } catch (e) {
        showToast('Error: ' + e.message, true);
      }
    });

    // Toggle Online/Offline with GPS Grab
    toggleBtn.addEventListener('click', () => {
      if (!driverId) {
        showToast('Save your profile first', true);
        return;
      }

      if (isOnline) {
        // Go Offline
        isOnline = false;
        updateDoc(doc(db, 'drivers', driverId), { status: 'offline' });
        updateToggleUI();
        showToast('You are now offline');
      } else {
        // Go Online - Request GPS
        toggleBtn.textContent = 'Getting GPS...';
        toggleBtn.disabled = true;

        if (!navigator.geolocation) {
          showToast('GPS not supported by browser', true);
          toggleBtn.disabled = false;
          toggleBtn.textContent = 'Go Online';
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            isOnline = true;
            await updateDoc(doc(db, 'drivers', driverId), {
              status: 'online',
              lat: lat,
              lng: lng,
              lastPing: new Date()
            });
            
            updateToggleUI();
            toggleBtn.disabled = false;
            showToast('You are online and visible for dispatch!');
          },
          (error) => {
            showToast('Please allow GPS to go online.', true);
            toggleBtn.disabled = false;
            updateToggleUI();
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    });

    loadProfile();
  </script>
</body>
</html>
