<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Logistics | Admin Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans">
    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="relative w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-xl flex items-center justify-center shadow-lg shadow-orange-600/30 text-white font-black tracking-tighter text-lg">
                    <span>KP</span>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-900 border-2 border-white rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-truck text-[6px] text-orange-400"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide leading-tight text-white">KP Logistics</h1>
                    <span class="text-[9px] text-orange-400 font-semibold uppercase tracking-widest block">Admin Command Center</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-300 hover:text-orange-400 transition">Book a Truck</a>
                <a href="driver.html" class="text-slate-300 hover:text-orange-400 transition">Driver Onboarding</a>
                <a href="driver-portal.html" class="text-slate-300 hover:text-orange-400 transition">Driver Portal</a>
                <a href="admin.html" class="text-orange-400 font-semibold transition">Admin Panel</a>
            </nav>
        </div>
    </header>

    <!-- Main Container (Hidden until authenticated) -->
    <main id="adminContent" class="max-w-7xl mx-auto mt-8 p-6 grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
        
        <!-- Live Bookings Section -->
        <section class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center justify-between">
                <span>Incoming Customer Bookings</span>
                <span id="bookingCount" class="text-xs bg-orange-100 text-orange-600 px-2.5 py-1 rounded-full font-semibold">0 Active</span>
            </h2>
            <div id="bookingsList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-sm text-slate-400">Loading bookings...</p>
            </div>
        </section>

        <!-- Driver Onboarding Requests Section -->
        <section class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center justify-between">
                <span>Driver Registrations (Paid)</span>
                <span id="driverCount" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-semibold">0 Registered</span>
            </h2>
            <div id="driversList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-sm text-slate-400">Loading drivers...</p>
            </div>
        </section>

    </main>

    <!-- Admin Security & Data Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Simple security passcode check before showing the dashboard
        const ADMIN_PIN = "2026"; 
        const enteredPin = prompt("Enter Admin Passcode to Access KP Logistics Dashboard:");

        if (enteredPin !== ADMIN_PIN) {
            alert("Access Denied. Incorrect passcode.");
            window.location.href = "index.html"; 
        } else {
            document.getElementById('adminContent').classList.remove('hidden');
        }

        // Your Live Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
            authDomain: "kp-logistics-1a015.firebaseapp.com",
            projectId: "kp-logistics-1a015",
            storageBucket: "kp-logistics-1a015.firebasestorage.app",
            messagingSenderId: "334125590321",
            appId: "1:334125590321:web:2adf74f76c7a68c6ddb210",
            measurementId: "G-DD5MCVTC81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadAdminData() {
            // Fetch Bookings
            const bookingsContainer = document.getElementById('bookingsList');
            try {
                const qBookings = query(collection(db, "bookings"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(qBookings);
                bookingsContainer.innerHTML = "";
                let bCount = 0;

                querySnapshot.forEach((docSnap) => {
                    bCount++;
                    const data = docSnap.data();
                    
                    const waMessage = `🚨 *NEW KP LOGISTICS TRIP*%0A%0A*Pickup:* ${encodeURIComponent(data.pickup)}%0A*Dropoff:* ${encodeURIComponent(data.dropoff)}%0A*Vehicle Class:* ${encodeURIComponent(data.vehicleType.toUpperCase())}%0A*Loaders:* ${data.assistantsRequested || 0}%0A*Total Escrow Fare:* ${encodeURIComponent(data.estimatedFare)}%0A%0A*Claim now in Driver Portal:* https://kp-logistics-1a015.web.app/driver-portal.html`;
                    const waLink = `https://wa.me/?text=${waMessage}`;

                    const card = document.createElement('div');
                    card.className = "p-4 border border-slate-100 bg-slate-50 rounded-xl shadow-sm space-y-2";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold uppercase bg-orange-500 text-white px-2 py-0.5 rounded">${data.vehicleType}</span>
                            <span class="text-xs font-semibold text-emerald-600">${data.status}</span>
                        </div>
                        <p class="text-sm font-semibold text-slate-700">📍 From: ${data.pickup}</p>
                        <p class="text-sm font-semibold text-slate-700">🏁 To: ${data.dropoff}</p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-200 mt-2">
                            <span class="text-xs text-slate-500">📞 Tel: ${data.phone}</span>
                            <a href="${waLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg inline-flex items-center space-x-1.5 transition shadow-sm">
                                <i class="fa-brands fa-whatsapp text-xs"></i>
                                <span>Broadcast to WhatsApp</span>
                            </a>
                        </div>
                    `;
                    bookingsContainer.appendChild(card);
                });
                document.getElementById('bookingCount').innerText = `${bCount} Total`;
                if(bCount === 0) bookingsContainer.innerHTML = `<p class="text-sm text-slate-500">No customer bookings found yet.</p>`;

            } catch (error) {
                console.error("Error loading bookings:", error);
                bookingsContainer.innerHTML = `<p class="text-sm text-red-500">Error loading bookings data.</p>`;
            }

            // Fetch Drivers
            const driversContainer = document.getElementById('driversList');
            try {
                const qDrivers = query(collection(db, "drivers"), orderBy("createdAt", "desc"));
                const driverSnapshot = await getDocs(qDrivers);
                driversContainer.innerHTML = "";
                let dCount = 0;

                driverSnapshot.forEach((docSnap) => {
                    dCount++;
                    const data = docSnap.data();
                    const bank = data.bankingDetails || {};

                    const card = document.createElement('div');
                    card.className = "p-4 border border-slate-100 bg-slate-50 rounded-xl shadow-sm space-y-2";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold uppercase bg-slate-900 text-white px-2 py-0.5 rounded">${data.vehicleType}</span>
                            <span class="text-xs text-emerald-600 font-semibold">${data.status}</span>
                        </div>
                        <p class="text-base font-bold text-slate-800">${data.name}</p>
                        <p class="text-sm text-slate-600">🚚 Vehicle: ${data.vehicleModel}</p>
                        <p class="text-xs text-slate-500">✉️ Email: ${data.email} | 📞 Tel: ${data.phone}</p>
                        
                        <!-- Payout Banking Details Box -->
                        <div class="p-3 bg-white rounded-lg border border-slate-200 mt-2 space-y-1 text-xs">
                            <p class="font-bold text-slate-700 uppercase tracking-wide text-[10px] text-orange-600">Payout Bank Details:</p>
                            <p class="text-slate-600"><b>Bank:</b> ${bank.bankName || 'N/A'} (${bank.accountType || 'N/A'})</p>
                            <p class="text-slate-600"><b>Holder:</b> ${bank.accountHolder || 'N/A'}</p>
                            <p class="text-slate-600 font-mono"><b>Acc No:</b> ${bank.accountNumber || 'N/A'} | <b>Branch:</b> ${bank.branchCode || 'N/A'}</p>
                        </div>

                        <p class="text-[11px] text-slate-400 font-mono pt-1">Ref: ${data.paymentReference}</p>
                    `;
                    driversContainer.appendChild(card);
                });
                document.getElementById('driverCount').innerText = `${dCount} Registered`;
                if(dCount === 0) driversContainer.innerHTML = `<p class="text-sm text-slate-500">No driver registrations yet.</p>`;

            } catch (error) {
                console.error("Error loading drivers:", error);
                driversContainer.innerHTML = `<p class="text-sm text-red-500">Error loading driver data.</p>`;
            }
        }

        loadAdminData();
    </script>
</body>
</html>
