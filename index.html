<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP-Logistics | Book a Truck or Van</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Navigation -->
    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider">KP-LOGISTICS <span class="text-xs text-orange-500 font-normal">by Kasiplus (PTY) Ltd</span></h1>
        <div class="space-x-4">
            <a href="index.html" class="text-orange-400 font-semibold">Book a Truck</a>
            <a href="driver.html" class="hover:text-orange-400">Driver Onboarding</a>
        </div>
    </nav>

    <!-- Main Booking Section -->
    <main class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md border border-slate-200">
        <h2 class="text-2xl font-bold mb-6 text-slate-800">Request a Vehicle</h2>
        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Pickup Address</label>
                <input type="text" id="pickup" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="e.g., 12 Mokone Street, Benoni">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Drop-off Address</label>
                <input type="text" id="dropoff" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="e.g., 45 Voortrekker Road">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Select Vehicle Type</label>
                <select id="vehicleType" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    <option value="bakkie">Light Bakkie (1-Ton)</option>
                    <option value="panelvan">Panel Van</option>
                    <option value="medtruck">Medium Truck (4-Ton)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Your Phone Number</label>
                <input type="tel" id="phone" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="082 123 4567">
            </div>
            <button type="submit" class="w-full bg-orange-600 text-white font-bold p-3 rounded-lg hover:bg-orange-700 transition">Find Driver & Book</button>
        </form>
    </main>

    <!-- Firebase SDKs via CDN -->
    <script type="module" src="app.js"></script>
</body>
</html>
