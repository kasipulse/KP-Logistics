<!-- Firebase Connection Script -->
    <script type="module" src="app.js"></script>
    <script>
        // PWA Install Prompt Handler
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('User accepted the install prompt');
            }
            deferredPrompt = null;
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
        });

        // Initialize Google Places Autocomplete restricted to South Africa
        window.addEventListener('load', function() {
            const pickupInput = document.getElementById('pickup');
            const dropoffInput = document.getElementById('dropoff');
            const resellerAddressInput = document.getElementById('resellerAddress');
            const options = { componentRestrictions: { country: "za" } };
            
            if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                new google.maps.places.Autocomplete(pickupInput, options);
                new google.maps.places.Autocomplete(dropoffInput, options);
                new google.maps.places.Autocomplete(resellerAddressInput, options);
            }
        });

        // Strict 10-digit South African Phone Validation helper
        function validatePhone(phoneValue) {
            const phoneRegex = /^0[0-9]{9}$/;
            return phoneRegex.test(phoneValue);
        }

        // Intercept main booking form phone validation check
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            const phoneInput = document.getElementById('phone').value.trim();
            if (!validatePhone(phoneInput)) {
                e.preventDefault();
                alert("Please enter a valid 10-digit South African mobile number starting with 0 (e.g., 0821234567).");
                document.getElementById('phone').focus();
            }
        });

        // Dynamic WhatsApp Reseller Dispatch Builder
        document.getElementById('resellerWaBtn').addEventListener('click', function() {
            const address = document.getElementById('resellerAddress').value.trim();
            const zone = document.getElementById('resellerZone').value;
            const phone = document.getElementById('resellerPhone').value.trim();

            if (!address) {
                alert("Please enter your collection address.");
                document.getElementById('resellerAddress').focus();
                return;
            }
            if (!validatePhone(phone)) {
                alert("Please enter a valid 10-digit mobile number starting with 0 for the collection contact.");
                document.getElementById('resellerPhone').focus();
                return;
            }

            const message = `📦 *TAKEALOT / AMAZON COLLECTION REQUEST*%0A%0A*Collection Address:* ${encodeURIComponent(address)}%0A*Zone:* ${encodeURIComponent(zone)}%0A*Contact Phone:* ${encodeURIComponent(phone)}%0A%0APlease dispatch driver for next-day DC delivery.`;
            
            const whatsappUrl = `https://wa.me/27821234567?text=${message}`;
            window.open(whatsappUrl, '_blank');
        });

        // Dynamic price feedback simulation based on vehicle selection & assistant quantity
        function updateEstimate() {
            const vehicleType = document.getElementById('vehicleType').value;
            const assistantCount = parseInt(document.getElementById('assistantCount').value) || 0;
            
            const basePrices = {
                bakkie: 350,
                closedbakkie: 400,
                panelvan: 520,
                medtruck: 890,
                "8ton": 2200,
                "8tonside": 2500,
                flatbed: 3000,
                towtruck: 1800
            };
            
            let currentTotal = basePrices[vehicleType] || 350;
            currentTotal += assistantCount * 200;
            
            document.getElementById('priceEstimate').innerText = `R ${currentTotal}.00`;
        }

        document.getElementById('vehicleType').addEventListener('change', updateEstimate);
        document.getElementById('assistantCount').addEventListener('input', updateEstimate);
        document.getElementById('assistantCount').addEventListener('change', updateEstimate);
    </script>
