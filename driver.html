<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Logistics | Driver - Onboarding</title>
    
    <!-- Blue Driver App Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='42' fill='%23ffffff'>KP</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50%' y='57%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='42' fill='%23ffffff'>KP</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-600 selection:text-white">
    
    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black tracking-tighter text-base shadow-md shadow-blue-600/30">
                    KP
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wider uppercase leading-none text-white">KP Logistics</h1>
                    <span class="text-[9px] text-blue-400 font-semibold uppercase tracking-widest block mt-0.5">Driver Portal</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-xs font-semibold tracking-wide uppercase">
                <a href="driver.html" class="text-blue-400 transition">Driver Onboarding</a>
                <a href="driver-portal.html" class="text-slate-300 hover:text-blue-400 transition">Driver Portal</a>
                <a href="complete-profile.html" class="text-slate-300 hover:text-blue-400 transition">Complete Profile</a>
            </nav>
            <div class="flex items-center space-x-3">
                <button id="installAppBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition shadow-md shadow-blue-600/20 uppercase tracking-wider items-center space-x-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span>Install App</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto my-12 px-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 to-sky-400"></div>
            
            <div class="mb-8">
                <div class="inline-block bg-blue-50 text-blue-800 border border-blue-200 text-[10px] font-bold uppercase px-3 py-1 rounded-full tracking-widest mb-3">
                    Driver Onboarding
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Register Your Vehicle</h2>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">Join Kasiplus (PTY) Ltd to receive commercial transport and delivery loads in your local operating zone.</p>
            </div>
            
            <form id="driverForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Full Legal Name</label>
                    <input type="text" id="driverName" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition" placeholder="John Smith">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Mobile Number (10 Digits)</label>
                        <input type="tel" id="driverPhone" required maxlength="10" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition" placeholder="0821234567">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Create Login PIN (4-6 Digits)</label>
                        <input type="password" id="driverPin" required minlength="4" maxlength="6" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition" placeholder="••••">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                    <input type="email" id="driverEmail" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition" placeholder="john@kplogistics.co.za">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Vehicle Make & Model</label>
                        <input type="text" id="vehicleModel" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition" placeholder="Toyota Hilux">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Vehicle Category</label>
                        <select id="regVehicleType" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition">
                            <option value="bakkie" selected>Light Bakkie (1-Ton)</option>
                            <option value="closedbakkie">Canopy Bakkie (Protected)</option>
                            <option value="panelvan">Panel Van</option>
                            <option value="medtruck">Medium Truck (4-Ton)</option>
                            <option value="8ton">8-Ton Heavy Truck (Box)</option>
                            <option value="8tonside">8-Ton Open Side / Curtain</option>
                            <option value="flatbed">Flatbed Truck</option>
                            <option value="towtruck">Tow Truck / Breakdown Recovery</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Primary Operating Region</label>
                        <select id="driverZone" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition">
                            <option value="East Rand">East Rand (Benoni, Springs, Boksburg, Germiston)</option>
                            <option value="Johannesburg">Johannesburg Central & Surrounds</option>
                            <option value="Pretoria">Pretoria / Tshwane</option>
                            <option value="West Rand">West Rand (Roodepoort, Krugersdorp)</option>
                            <option value="Vaal">Vaal Triangle (Vereeniging)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Vehicle Fuel Type</label>
                        <select id="fuelType" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition">
                            <option value="petrol">Petrol</option>
                            <option value="diesel">Diesel</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">Voucher / Promo Code <span class="text-slate-400 font-normal">(Optional)</span></label>
                    <input type="text" id="voucherCode" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none text-xs text-slate-900 transition uppercase" placeholder="">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl transition shadow-lg shadow-blue-600/35 flex items-center justify-center space-x-2 text-xs uppercase tracking-wider mt-2">
                    <span>Complete Registration</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
                alert("📱 To install on your iPhone:\n\n1. Tap the 'Share' button ⎋ below.\n2. Select 'Add to Home Screen ➕'.");
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            } else {
                alert("To install this app, open your browser menu and select 'Install App' or 'Add to Home Screen'.");
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
            authDomain: "kp-logistics-1a015.firebaseapp.com",
            projectId: "kp-logistics-1a015",
            storageBucket: "kp-logistics-1a015.firebasestorage.app",
            messagingSenderId: "334125590321",
            appId: "1:334125590321:web:2adf74f76c7a68c6ddb210",
            measurementId: "G-DD5MCVTC81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function validatePhone(phoneValue) {
            return /^0[0-9]{9}$/.test(phoneValue);
        }

        document.getElementById('driverForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('driverPhone').value.trim();
            const pin = document.getElementById('driverPin').value.trim();

            if (!validatePhone(phone)) {
                alert("Please enter a valid 10-digit South African mobile number starting with 0.");
                document.getElementById('driverPhone').focus();
                return;
            }

            try {
                await addDoc(collection(db, "drivers"), {
                    name: document.getElementById('driverName').value,
                    email: document.getElementById('driverEmail').value,
                    vehicleModel: document.getElementById('vehicleModel').value,
                    vehicleType: document.getElementById('regVehicleType').value,
                    phone: phone,
                    pin: pin, // Saved secure PIN
                    fuelType: document.getElementById('fuelType').value,
                    zone: document.getElementById('driverZone').value,
                    voucherCode: document.getElementById('voucherCode').value.trim() || "None Provided",
                    status: "Active - Registered",
                    createdAt: new Date()
                });
                
                alert("Registration successful! Welcome to the KP Logistics Driver Network.");
                window.location.href = "driver-portal.html";
            } catch (error) {
                console.error("Error saving driver profile: ", error);
                alert("Registration failed. Please check your connection and try again.");
            }
        });
    </script>
</body>
</html>
