<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Logistics | Partner Network Driver Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Paystack Checkout Inline Script -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="relative w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-xl flex items-center justify-center shadow-lg shadow-orange-600/30 text-white font-black tracking-tighter text-lg">
                    <span>KP</span>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-900 border-2 border-white rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-truck text-[6px] text-orange-400"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide leading-tight text-white">KP Logistics</h1>
                    <span class="text-[9px] text-orange-400 font-semibold uppercase tracking-widest block">Partner Network</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-300 hover:text-orange-400 transition">Book a Truck</a>
                <a href="driver.html" class="text-orange-400 font-semibold transition">Driver Onboarding</a>
                <a href="driver-portal.html" class="text-slate-300 hover:text-orange-400 transition">Driver Portal</a>
                <a href="admin.html" class="text-slate-300 hover:text-orange-400 transition">Admin Panel</a>
            </nav>
        </div>
    </header>

    <main class="max-w-xl mx-auto my-12 px-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-orange-500 to-amber-500"></div>
            
            <div class="mb-6">
                <span class="inline-block bg-orange-100 text-orange-800 border border-orange-200 text-[10px] font-extrabold uppercase px-3 py-1 rounded-full tracking-widest mb-2">
                    🚚 Fleet Partner Registration
                </span>
                <h2 class="text-2xl font-bold text-slate-900 mt-1">Register Your Vehicle</h2>
                <p class="text-sm text-slate-500 mt-1">Join Kasiplus (PTY) Ltd to receive commercial transport and delivery loads in your local operating zone.</p>
            </div>
            
            <form id="driverForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Legal Name</label>
                    <input type="text" id="driverName" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm" placeholder="John Smith">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                    <input type="email" id="driverEmail" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm" placeholder="john@kplogistics.co.za">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Vehicle Make & Model</label>
                        <input type="text" id="vehicleModel" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm" placeholder="Toyota Hilux">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Vehicle Category</label>
                        <select id="regVehicleType" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm">
                            <option value="bakkie" selected>Light Bakkie (1-Ton)</option>
                            <option value="closedbakkie">Canopy Bakkie (Protected)</option>
                            <option value="panelvan">Panel Van</option>
                            <option value="medtruck">Medium Truck (4-Ton)</option>
                            <option value="8ton">8-Ton Heavy Truck (Box)</option>
                            <option value="8tonside">8-Ton Open Side / Curtain</option>
                            <option value="flatbed">Flatbed Truck</option>
                            <option value="towtruck">Tow Truck / Breakdown Recovery</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Mobile Number (10 Digits)</label>
                        <input type="tel" id="driverPhone" required maxlength="10" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm" placeholder="0821234567">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Vehicle Fuel Type</label>
                        <select id="fuelType" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm">
                            <option value="petrol">Petrol</option>
                            <option value="diesel">Diesel</option>
                        </select>
                    </div>
                </div>

                <!-- Primary Operating Region / Zone -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Primary Operating Region / Zone</label>
                    <select id="driverZone" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm">
                        <option value="East Rand">East Rand (Benoni, Springs, Boksburg, Kempton Park, Germiston)</option>
                        <option value="Johannesburg">Johannesburg Central & Surrounds</option>
                        <option value="Pretoria">Pretoria / Tshwane</option>
                        <option value="West Rand">West Rand (Roodepoort, Krugersdorp, Randfontein)</option>
                        <option value="Vaal">Vaal Triangle (Vereeniging, Vanderbijlpark)</option>
                    </select>
                </div>

                <!-- Voucher / Promo Code Input -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Voucher / Promo Code <span class="text-slate-400 font-normal">(Optional)</span></label>
                    <input type="text" id="voucherCode" placeholder="e.g., FOUNDING2026" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm uppercase">
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                    <span>Complete Registration & Enter Portal</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Database Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABtMzUk8hZ0fJgPG3Osz2lQ64RkmBS3kw",
            authDomain: "kp-logistics-1a015.firebaseapp.com",
            projectId: "kp-logistics-1a015",
            storageBucket: "kp-logistics-1a015.firebasestorage.app",
            messagingSenderId: "334125590321",
            appId: "1:334125590321:web:2adf74f76c7a68c6ddb210",
            measurementId: "G-DD5MCVTC81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Strict 10-digit phone validator
        function validatePhone(phoneValue) {
            const phoneRegex = /^0[0-9]{9}$/;
            return phoneRegex.test(phoneValue);
        }

        const driverForm = document.getElementById('driverForm');
        driverForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('driverPhone').value.trim();
            if (!validatePhone(phone)) {
                alert("Please enter a valid 10-digit South African mobile number starting with 0 (e.g., 0821234567).");
                document.getElementById('driverPhone').focus();
                return;
            }

            const name = document.getElementById('driverName').value;
            const email = document.getElementById('driverEmail').value;
            const vehicleModel = document.getElementById('vehicleModel').value;
            const vehicleType = document.getElementById('regVehicleType').value;
            const fuelType = document.getElementById('fuelType').value;
            const zone = document.getElementById('driverZone').value;
            const voucher = document.getElementById('voucherCode').value.trim() || "None Provided";
            
            try {
                await addDoc(collection(db, "drivers"), {
                    name: name,
                    email: email,
                    vehicleModel: vehicleModel,
                    vehicleType: vehicleType,
                    phone: phone,
                    fuelType: fuelType,
                    zone: zone,
                    voucherCode: voucher,
                    status: "Active - Registered",
                    createdAt: new Date()
                });
                
                alert(`Registration successful! Welcome to the KP Logistics Partner Network.`);
                window.location.href = "driver-portal.html";
            } catch (error) {
                console.error("Error saving driver profile: ", error);
                alert("Registration failed. Please check your connection and try again.");
            }
        });
    </script>
</body>
</html>
